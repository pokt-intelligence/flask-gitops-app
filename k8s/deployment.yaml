apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: default
spec:
  replicas: 30
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
      - name: flask
        image: flask-gitops-app:v1
        imagePullPolicy: Never  # Tells Kubernetes to use the local Minikube image cache
        ports:
        - containerPort: 5000